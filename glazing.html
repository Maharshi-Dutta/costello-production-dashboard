<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glazing station</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪟</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* The same tokens as the other two floor screens, so a tablet that shows more
     than one does not change character between them. Dark by default; the light
     set is behind data-theme="light", which the header button sets and the
     device remembers (cw_stationtheme - it belongs to the device, not to the
     person). There is deliberately no link from here to the master dashboard.

     THREE COLOUR LEVELS, as welding has: no colour = nothing glazed, yellow =
     started, green = every unit glazed. Green rather than gold, for the same
     reason welding uses green - gold already means "the job is finished" on the
     glass board and on the office's rows, and this is a different sentence. */
  :root {
    --bg:#16161a; --surface:#1e1e23; --surface-2:#24242a; --line:#33333b; --line-soft:#2b2b32;
    --ink:#f2f1ee; --ink-2:#c9c6bf; --ink-3:#9a968d; --ink-4:#7a776f;
    --brand:#0e0e11; --onbrand:#f7f6f3; --brand-2:#26262a; --brand-line:#3a3a3e;
    --accent:#6aa9ec;
    --urgent:#f07a72;
    --warm:#e8c65a; --warm-bg:#39310f; --warm-line:#6b5a1c;
    --good:#7fca7f; --good-bg:#1c3320; --good-line:#3d6b42;
  }
  :root[data-theme="light"] {
    --bg:#f2f1ee; --surface:#fff; --surface-2:#faf9f7; --line:#dcd9d2; --line-soft:#efece7;
    --ink:#17171a; --ink-2:#4d4a44; --ink-3:#6d6a62; --ink-4:#8e8b84;
    --brand:#17171a; --onbrand:#f7f6f3; --brand-2:#26262a; --brand-line:#3a3a3e;
    --accent:#184f95;
    --urgent:#b3261e;
    --warm:#8a6d00; --warm-bg:#fff6dd; --warm-line:#e4cf8a;
    --good:#1f6b2c; --good-bg:#e8f6e8; --good-line:#a9d8ac;
  }
  * { box-sizing:border-box }
  [hidden] { display:none !important }
  body { margin:0; background:var(--bg); color:var(--ink); font-size:15px;
         font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
         -webkit-text-size-adjust:100% }
  .cond { font-family:"Barlow Condensed",sans-serif; font-variant-numeric:tabular-nums }
  .tab { font-variant-numeric:tabular-nums }
  button { font:inherit; cursor:pointer }
  @keyframes rise { from{transform:translateY(9px);opacity:0} to{transform:none;opacity:1} }
  @keyframes shake { 10%,90%{transform:translateX(-2px)} 30%,70%{transform:translateX(5px)}
                     50%{transform:translateX(-7px)} 100%{transform:none} }

  /* ---- sign in ---- */
  #gate { position:fixed; inset:0; background:var(--brand); color:var(--onbrand); z-index:80;
          display:flex; align-items:center; justify-content:center }
  .gatebox { max-width:420px; padding:30px; text-align:left }
  .gatebox h1 { font-family:"Barlow Condensed",sans-serif; font-size:42px; margin:0 0 6px;
                text-transform:uppercase; letter-spacing:.02em }
  .gatebox p { color:#a8a49a; line-height:1.55; margin:0 0 22px; font-size:14.5px }
  .signin { background:#fff; color:#17171a; border:0; padding:15px 24px; border-radius:6px;
            font-size:16px; font-weight:600; display:inline-flex; align-items:center; gap:10px; min-height:52px }
  #gateerr { margin-top:18px; color:var(--urgent); font-size:13.5px; line-height:1.5; white-space:pre-wrap;
             display:none; background:#2a1a1a; padding:11px 13px; border-radius:5px; border:1px solid #5a2a2a }

  /* ---- the bar across the top ----
     TWO ROWS, AND NEVER THREE, which is the tablet rule the welding page
     learned on the owner's ten-inch screen in portrait (about 800 x 1280).
     Each row is its own flex line with nothing allowed to wrap; only #search
     may grow or shrink, so the header is the same two rows at 700 px and at
     1100 px and nothing can be pushed onto a third. */
  header.top { position:sticky; top:0; z-index:30; background:var(--brand); color:var(--onbrand);
               padding:9px 16px; display:flex; flex-direction:column; gap:8px }
  .toprow { display:flex; align-items:center; gap:10px; flex-wrap:nowrap; min-width:0 }
  .brand { font-family:"Barlow Condensed",sans-serif; font-size:24px; font-weight:700;
           text-transform:uppercase; white-space:nowrap; flex:none }
  #whois { font-size:14.5px; font-weight:600; color:var(--onbrand);
           background:var(--brand-2); border:1px solid var(--brand-line); border-radius:24px;
           padding:7px 14px; min-height:38px; display:flex; align-items:center;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0 }
  #whois:empty { display:none }
  /* what is left across the whole board, read at a glance and never tapped -
     so 38 px rather than a 44 px target, like #whois */
  #gtotal { font-size:16px; font-weight:700; color:var(--onbrand);
            background:var(--brand-2); border:1px solid var(--brand-line); border-radius:24px;
            padding:7px 16px; min-height:38px; flex:none; white-space:nowrap;
            display:flex; align-items:center; justify-content:center }
  #upd { font-size:12px; color:#a8a49a; margin-left:auto; white-space:nowrap; flex:none }
  /* 16px exactly: anything smaller and iOS zooms the whole page in when the box
     is focused, which on a wall-mounted tablet nobody can zoom back out. It is
     the ONLY thing on row 2 that flexes. */
  #search { background:var(--brand-2); color:var(--onbrand); border:1px solid var(--brand-line);
            border-radius:24px; min-height:48px; padding:0 16px; font-size:16px;
            font-family:inherit; flex:1 1 auto; min-width:90px; width:auto }
  #search::placeholder { color:#8a867e }
  #switchbtn { background:var(--brand-2); color:var(--onbrand); border:1px solid var(--brand-line);
               border-radius:24px; min-height:48px; padding:0 15px; font-size:14px; font-weight:600;
               white-space:nowrap; flex:none }
  #themebtn, #outbtn { background:transparent; color:#a8a49a; border:1px solid var(--brand-line);
                       border-radius:6px; min-height:48px; padding:0 13px; font-size:13px;
                       white-space:nowrap; flex:none }

  /* ---- the board ----
     ONE FULL-WIDTH COLUMN, at every width, with minmax(0,1fr) tracks wherever
     there is a grid. The owner rejected two columns on the ten-inch tablet in
     portrait, and a plain `1fr` track is min-content wide - which is the trap
     the glass page carried until 2026-09-21 and the reason a long customer name
     used to push the page sideways. Nothing here scrolls sideways at 700-1100
     px, and the stepper column never moves. */
  #main { padding:14px 16px 40px; max-width:980px; margin:0 auto }
  #soft { font-size:13px; color:var(--urgent); padding:0 2px 8px }
  .grp { display:grid; grid-template-columns:minmax(0,1fr); gap:12px }
  .grouphead { font-size:12px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
               font-weight:600; color:var(--ink-4); margin:18px 0 6px; min-height:48px;
               display:flex; align-items:center }
  .msg { padding:34px 20px; text-align:center; color:var(--ink-3); font-size:15px; line-height:1.6 }
  .again { margin-top:16px; min-height:48px; padding:0 20px; border:1px solid var(--line);
           border-radius:6px; background:var(--surface); color:var(--ink); font-size:15px }

  .card { border:1px solid var(--line); border-radius:7px; background:var(--surface);
          padding:13px 14px; animation:rise .22s both; min-width:0 }
  .card.c-yellow { border-color:var(--warm-line) }
  .card.c-green { background:var(--good-bg); border-color:var(--good-line) }
  .chead { display:flex; align-items:baseline; gap:12px; margin-bottom:5px; flex-wrap:nowrap; min-width:0 }
  .job { font-size:28px; font-weight:700; line-height:1; flex:none }
  .cust { font-size:16px; color:var(--ink-2); flex:1 1 auto; min-width:0;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .cunits { font-size:15px; font-weight:700; color:var(--ink-2); white-space:nowrap;
            flex:none; margin-left:auto }
  .cfacts { display:flex; gap:12px; align-items:baseline; margin-bottom:12px; flex-wrap:nowrap; min-width:0 }
  .cqty { font-size:14.5px; color:var(--ink-3); white-space:nowrap; flex:none }
  /* the COMMENT, after the rule-3 strip. No phone number and no eircode ever
     reaches this list, so none can reach this line - but it is still the
     office's own sentence and is shown as written. Two lines, then an ellipsis:
     one clipped line is usually the half that says nothing. */
  .ccmt { font-size:14.5px; color:var(--ink-3); font-style:italic; min-width:0; flex:1 1 auto;
          line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
          overflow:hidden }

  .saving { margin-top:10px; font-size:12px; color:var(--ink-4) }
  .unsaved { margin-top:10px; font-size:12.5px; font-weight:600; color:var(--urgent) }

  /* ---- the one stepper -------------------------------------------------------
     THREE TRACKS, AND THE BUTTONS ALWAYS IN THE SAME COLUMN: a fixed label, the
     count and its bar (minmax(0,1fr), which is what may actually shrink), and
     the three buttons, whose column never moves. Everything tapped is 56 px
     tall and at least 64 px wide, because it is tapped with a work glove on. */
  .step { display:grid; grid-template-columns:116px minmax(0,1fr) auto;
          gap:12px; align-items:center }
  .step.locked { opacity:.5 }
  .stepl { font-size:16px; color:var(--ink-2); min-width:0 }
  .stepleft { font-size:17px; font-weight:700; color:var(--ink); display:block; margin-top:1px }
  .step.c-green .stepleft { color:var(--good) }
  .nomine { font-size:12px; color:var(--ink-4); display:block }
  .stepmid { min-width:0 }
  .stepn { font-size:22px; font-weight:700; display:block; text-align:left; line-height:1.1 }
  .stepn.full { color:var(--good) }
  .wbar { display:block; height:10px; margin-top:6px; border-radius:5px;
          background:var(--line-soft); overflow:hidden }
  .wbarfill { display:block; height:100%; background:var(--warm); border-radius:5px }
  .step.c-green .wbarfill { background:var(--good) }
  /* FIXED widths, not min-widths: "None" is a wider word than "All", and a
     min-width moved the - and + under a thumb between a finished card and an
     unfinished one (welding, 2026-09-16). */
  .stepc { display:flex; gap:8px; align-items:center; justify-content:flex-end; flex:none }
  .sbtn { width:64px; height:56px; flex:none; border:1px solid var(--line); border-radius:8px;
          background:var(--surface); color:var(--ink); font-size:24px; line-height:1 }
  .sall { width:84px; height:56px; flex:none; padding:0; border:1px solid var(--line);
          border-radius:8px; background:var(--surface); color:var(--ink-2); font-size:15px;
          font-weight:600; white-space:nowrap }
  .sbtn:active, .sall:active { background:var(--line-soft) }
  .sbtn:disabled, .sall:disabled { opacity:.4; cursor:default }

  /* ---- a word for the office (station comments, shared) ---- */
  .cmt { margin-top:11px; border-top:1px solid var(--line-soft); padding-top:9px }
  .cmtog { display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:0 13px;
           border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
           color:var(--ink-2); font-size:13.5px }
  .cmtog:active { background:var(--line-soft) }
  .cmicon { flex:none; opacity:.8 }
  .cmbody { margin-top:10px }
  .cmthread { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; margin-bottom:10px;
              max-height:220px; overflow-y:auto }
  .cmrow { background:var(--surface-2); border:1px solid var(--line-soft); border-radius:6px;
           padding:8px 10px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px }
  .cmwho { font-size:12px; font-weight:600; color:var(--ink-2) }
  .cmwhen { font-size:11.5px; color:var(--ink-4); text-align:right }
  .cmtext { grid-column:1/-1; font-size:14px; line-height:1.45; white-space:pre-wrap;
            overflow-wrap:anywhere }
  .cmbox { width:100%; min-height:72px; border:1px solid var(--line); border-radius:7px;
           background:var(--surface-2); color:var(--ink); font-size:16px; font-family:inherit;
           padding:10px 11px; resize:vertical }
  .cmfoot { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px }
  .cmnote { font-size:11.5px; color:var(--ink-4); line-height:1.35 }
  .cmnote.bad { color:var(--urgent); font-weight:600; font-size:12.5px }
  .cmsend { min-height:44px; padding:0 20px; border:1px solid var(--line); border-radius:7px;
            background:var(--surface-2); color:var(--ink); font-size:15px; font-weight:600 }
  .cmsend:active { background:var(--line-soft) }
  .cmsend:disabled { opacity:.4; cursor:default }
  .cmhint { font-size:12.5px; color:var(--ink-3); line-height:1.5; margin-bottom:10px }

  /* ---- who are you? ---- */
  .picker { max-width:560px; margin:0 auto; padding:18px 4px 40px }
  .pickh { font-family:"Barlow Condensed",sans-serif; font-size:34px; font-weight:700;
           text-transform:uppercase; letter-spacing:.02em; margin-bottom:4px }
  .picksub { font-size:14px; color:var(--ink-3); margin-bottom:18px }
  .pgrid { display:grid; grid-template-columns:minmax(0,1fr); gap:12px; margin-top:14px }
  .pbtn { min-height:64px; border:1px solid var(--line); border-radius:8px; background:var(--surface);
          color:var(--ink); text-align:left; padding:10px 18px; display:flex; flex-direction:column;
          justify-content:center; gap:3px }
  .pbtn:active { background:var(--surface-2) }
  .pname { font-size:19px; font-weight:600 }
  .pstages { font-size:12.5px; color:var(--ink-3) }
  .pindots { font-size:32px; letter-spacing:.3em; color:var(--ink-2); min-height:44px; margin:6px 0 2px }
  .pindots.shake { animation:shake .4s both }
  .pinbad { color:var(--urgent); font-size:13.5px; font-weight:600; margin-bottom:6px }
  .pinpad { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:10px }
  .pk { min-height:56px; border:1px solid var(--line); border-radius:8px; background:var(--surface);
        color:var(--ink); font-size:22px; font-weight:600 }
  .pk:active { background:var(--surface-2) }
  .pk.go { background:var(--surface-2); font-size:17px }
  .pcancel { margin-top:16px; min-height:48px; width:100%; border:1px solid var(--line);
             border-radius:6px; background:transparent; color:var(--ink-3); font-size:14px }

  /* A narrow phone is the only place the three stepper tracks will not fit, so
     there the count and its bar drop onto their own line UNDER the label rather
     than squeezing the buttons off the side. The buttons keep their size and
     their column; nothing ever scrolls sideways at any width. */
  @media (max-width:520px){
    .toprow { flex-wrap:wrap; row-gap:8px }
    #main { padding:12px 12px 32px }
    .step { grid-template-columns:minmax(0,1fr) auto; row-gap:6px }
    .stepmid { grid-column:1/-1; order:3 }
    .stepl { font-size:15px }
    .job { font-size:25px }
    .brand { font-size:21px }
    .chead, .cfacts { flex-wrap:wrap }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gatebox">
    <h1>Glazing station</h1>
    <p>Sign in with the station account to see today's glazing and record the
       units that have been glazed.</p>
    <button class="signin" id="signinbtn">
      <svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f25022" d="M1 1h10v10H1z"/><path fill="#7fba00" d="M12 1h10v10H12z"/><path fill="#00a4ef" d="M1 12h10v10H1z"/><path fill="#ffb900" d="M12 12h10v10H12z"/></svg>
      Sign in
    </button>
    <div id="gateerr"></div>
  </div>
</div>

<header class="top" hidden id="top">
  <div class="toprow">
    <span class="brand">Glazing</span>
    <span id="whois"></span>
    <span id="gtotal" hidden></span>
    <span id="upd"></span>
  </div>
  <div class="toprow">
    <input id="search" type="search" placeholder="Find a job" autocomplete="off" hidden>
    <button id="switchbtn" hidden>Switch person</button>
    <button id="themebtn">Light</button>
    <button id="outbtn">Sign out</button>
  </div>
</header>

<div id="main" hidden>
  <div id="soft" hidden></div>
  <div id="board"></div>
</div>

<script src="vendor/msal-browser.min.js"></script>
<script src="graph.js"></script>
<script src="station-core.js"></script>
<script src="station-ui.js"></script>
<script src="glazing-core.js"></script>
<script src="glazing.js"></script>
</body>
</html>
